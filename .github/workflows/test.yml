name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install the skills the CLI loads at runtime
        # sip01-search wraps the sip-01 and nostr skills' scripts rather than
        # reimplementing the protocol, so the tests need those scripts on disk.
        run: |
          git clone --depth 1 https://github.com/SIP-01/sip-01-skill.git "$RUNNER_TEMP/sip-01-skill"
          git clone --depth 1 https://github.com/NostrDanish/nostr-skill.git "$RUNNER_TEMP/nostr-skill"
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          SIP01_SKILL_ROOT: ${{ runner.temp }}/sip-01-skill
          NOSTR_SKILL_ROOT: ${{ runner.temp }}/nostr-skill
      - name: Syntax check
        run: python -m py_compile sip01_search.py sip01_format.py
